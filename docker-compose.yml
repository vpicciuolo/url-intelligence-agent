services:
  url-agent:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - url_agent_data:/app/.url-agent
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: urlagent
      POSTGRES_USER: urlagent
      POSTGRES_PASSWORD: urlagent
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  url_agent_data:
  redis_data:
  postgres_data:
