name: Run isolated v1.4 report suite builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-report-suite-builder.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.4-report-suite
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize staged report code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          staged=Path('.github/workflows/build-v1.4-report-suite.yml').read_text(encoding='utf-8')
          blocks=re.findall(r"cat > /tmp/(report-suite|report-test)\.b64 <<'B64'\n(.*?)\nB64",staged,re.S)
          if len(blocks)!=2: raise SystemExit(f'Expected two staged payloads, got {len(blocks)}')
          data={n:gzip.decompress(base64.b64decode(b.strip())).decode('utf-8') for n,b in blocks}
          Path('src/report-suite.ts').write_text(data['report-suite'],encoding='utf-8')
          Path('src/export-report.ts').write_text('export * from "./report-suite.js";\n',encoding='utf-8')
          Path('tests/report.test.ts').write_text(data['report-test'],encoding='utf-8')
          print('report suite bytes',len(data['report-suite']))
          print('report test bytes',len(data['report-test']))
          PY

      - name: Make footer pagination-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/report-suite.ts')
          s=p.read_text(encoding='utf-8')
          pattern=r'function footer\(doc:any,page:number,count:number\)\{.*?\}\nfunction pdata'
          replacement='''function footer(doc:any,page:number,count:number){const w=doc.page.width,h=doc.page.height,line=`${EXPORT_BRAND.name} | ${EXPORT_BRAND.github} | ${EXPORT_BRAND.huggingFace} | Creator: ${EXPORT_BRAND.creator}`,oldY=doc.y,oldBottom=doc.page.margins.bottom;doc.page.margins.bottom=0;doc.save();doc.fillColor(C.text).fillOpacity(.04).font("Helvetica-Bold").fontSize(9).rotate(-28,{origin:[w/2,h/2]}).text(line,54,h/2-8,{width:w-108,align:"center",lineBreak:false});doc.restore();doc.save();doc.strokeColor("#CBD5E1").lineWidth(.5).moveTo(42,h-58).lineTo(w-42,h-58).stroke();doc.fillColor(C.muted).font("Helvetica").fontSize(6).text(line,42,h-50,{width:w-150,lineBreak:false});doc.fillColor(C.muted).font("Helvetica-Bold").fontSize(6.1).text(`Page ${page} / ${count}`,w-116,h-50,{width:74,align:"right",lineBreak:false});doc.restore();doc.page.margins.bottom=oldBottom;doc.y=oldY}\nfunction pdata'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Footer replacement failed: {n}')
          p.write_text(s2,encoding='utf-8')
          PY

      - name: Update docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md');s=p.read_text(encoding='utf-8');marker='## 1.3.0 — Semantic Conflict Intelligence Release'
          block='''### Report suite upgrade\n- Rebuilds PDF, HTML, Markdown and JSON reporting around the v1.4 evidence model.\n- Adds visual KPI cards, assessment bars, evidence-layer distribution, semantic reconciliation tables, stale-metadata tables, conflict/drift registers, source-diversity summaries and structured crawl/RAG/provenance appendices.\n- Fixes PDF footer pagination so watermark/page-number rendering no longer creates duplicate blank pages.\n- Adds regression coverage for bounded PDF page counts and v1.4 report sections.\n\n'''
          if block not in s:s=s.replace(marker,block+marker)
          p.write_text(s,encoding='utf-8')
          p=Path('README.md');s=p.read_text(encoding='utf-8');marker='Selecting a preferred value never deletes the alternatives. If the evidence cannot resolve a disagreement, the claim remains a conflict or drift state and the evidence trail stays intact.\n'
          extra='''\n### Reporting suite\n\nThe v1.4 report suite presents the evidence model in polished PDF, HTML, Markdown and JSON exports. PDF and HTML include visual summaries, structured tables, semantic reconciliation, stale-metadata analysis, conflict/drift registers, source-diversity summaries and traceable appendices. PDF footer pagination is regression-tested to prevent blank-page multiplication.\n'''
          if extra not in s:s=s.replace(marker,marker+extra)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Provenance fixtures
        run: npm run test:provenance-fixtures
      - name: Validate
        run: |
          git diff --check
          grep -q 'Semantic cross-field reconciliation' src/report-suite.ts
          grep -q 'Suspected stale metadata' src/report-suite.ts
          grep -q 'footer/watermark regression' tests/report.test.ts
          grep -q 'margins.bottom=0' src/report-suite.ts

      - name: Commit tested report suite to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/report-suite.ts src/export-report.ts tests/report.test.ts README.md CHANGELOG.md
          git commit -m "feat: upgrade v1.4 report suite and fix PDF pagination"
          git push origin HEAD:fix/v1.4-report-suite
