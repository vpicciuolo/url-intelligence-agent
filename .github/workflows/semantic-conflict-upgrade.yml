name: One-time Semantic Conflict Intelligence Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/semantic-conflict-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply semantic conflict intelligence upgrade
        run: python3 scripts/semantic-conflict-upgrade.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Commit upgraded release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/deploy-huggingface.yml
          git add src tests package.json README.md CHANGELOG.md VERSIONING.md SECURITY.md docs hf-space scripts/semantic-conflict-upgrade.py
          if git diff --cached --quiet; then
            echo "No upgrade changes to commit."
            exit 0
          fi
          git commit -m "Release v1.3.0 semantic conflict intelligence"
          git push origin HEAD:main
