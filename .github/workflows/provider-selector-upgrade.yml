name: Apply External Search Provider Selector Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-selector-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime and Hugging Face UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"Expected at least {count} match(es) in {path}, found {actual}\nOLD:\n{old[:500]}")
              text = text.replace(old, new, count)
              p.write_text(text)
              print(f"patched {path}")

          # research.ts: provider discovery/status + per-request provider selection.
          replace('src/research.ts', '''function configuredProvider(): string | undefined {
            const requested = String(process.env.URL_AGENT_SEARCH_PROVIDER || "").trim().toLowerCase();
            if (requested === "off" || requested === "none" || requested === "disabled") return undefined;
            if (requested === "duckduckgo" || requested === "ddg") return "duckduckgo";
            if (requested === "searxng" && process.env.URL_AGENT_SEARCH_ENDPOINT) return "searxng";
            if (requested === "brave" && process.env.BRAVE_SEARCH_API_KEY) return "brave";
            if (requested === "serper" && process.env.SERPER_API_KEY) return "serper";
            if (requested === "tavily" && process.env.TAVILY_API_KEY) return "tavily";
            if (requested === "google-cse" && process.env.GOOGLE_CSE_API_KEY && process.env.GOOGLE_CSE_CX) return "google-cse";
            if (process.env.URL_AGENT_SEARCH_ENDPOINT) return "searxng";
            if (process.env.BRAVE_SEARCH_API_KEY) return "brave";
            if (process.env.SERPER_API_KEY) return "serper";
            if (process.env.TAVILY_API_KEY) return "tavily";
            if (process.env.GOOGLE_CSE_API_KEY && process.env.GOOGLE_CSE_CX) return "google-cse";
            return "duckduckgo";
          }''', '''export type SearchProviderName = "google-cse" | "duckduckgo" | "brave" | "serper" | "tavily" | "searxng";

          const SEARCH_PROVIDER_LABELS: Record<SearchProviderName, string> = {
            "google-cse": "Google Custom Search",
            duckduckgo: "DuckDuckGo",
            brave: "Brave Search",
            serper: "Serper (Google index)",
            tavily: "Tavily",
            searxng: "SearXNG"
          };

          function normalizeProvider(value: unknown): SearchProviderName | undefined {
            const raw = String(value || "").trim().toLowerCase();
            if (!raw) return undefined;
            if (raw === "google" || raw === "google-cse" || raw === "google_custom_search") return "google-cse";
            if (raw === "ddg" || raw === "duckduckgo") return "duckduckgo";
            if (raw === "brave") return "brave";
            if (raw === "serper") return "serper";
            if (raw === "tavily") return "tavily";
            if (raw === "searx" || raw === "searxng") return "searxng";
            return undefined;
          }

          function providerAvailable(provider: SearchProviderName): boolean {
            if (provider === "duckduckgo") return true;
            if (provider === "google-cse") return Boolean(process.env.GOOGLE_CSE_API_KEY && process.env.GOOGLE_CSE_CX);
            if (provider === "brave") return Boolean(process.env.BRAVE_SEARCH_API_KEY);
            if (provider === "serper") return Boolean(process.env.SERPER_API_KEY);
            if (provider === "tavily") return Boolean(process.env.TAVILY_API_KEY);
            if (provider === "searxng") return Boolean(process.env.URL_AGENT_SEARCH_ENDPOINT);
            return false;
          }

          export function searchProviderStatus() {
            const preferred = normalizeProvider(process.env.URL_AGENT_SEARCH_PROVIDER) || "google-cse";
            const providers = (Object.keys(SEARCH_PROVIDER_LABELS) as SearchProviderName[]).map(id => ({
              id,
              label: SEARCH_PROVIDER_LABELS[id],
              available: providerAvailable(id),
              requiresConfiguration: id !== "duckduckgo"
            }));
            const fallback = providers.find(p => p.id === preferred && p.available)?.id
              || providers.find(p => p.id === "google-cse" && p.available)?.id
              || "duckduckgo";
            return { preferred, default: fallback, providers };
          }

          function configuredProvider(requestedProvider?: string): SearchProviderName | undefined {
            const explicit = normalizeProvider(requestedProvider);
            if (requestedProvider && !explicit) throw new Error(`Unsupported search provider: ${requestedProvider}`);
            if (explicit) {
              if (!providerAvailable(explicit)) throw new Error(`${SEARCH_PROVIDER_LABELS[explicit]} is not configured on this runtime.`);
              return explicit;
            }
            const status = searchProviderStatus();
            return status.default as SearchProviderName;
          }''')

          replace('src/research.ts', 'export async function researchExternalWeb(rootUrl: string, entityName: string, pages: PageSignal[]): Promise<WebResearchReport> {', 'export async function researchExternalWeb(rootUrl: string, entityName: string, pages: PageSignal[], requestedProvider?: string): Promise<WebResearchReport> {')
          replace('src/research.ts', '  const provider = configuredProvider();', '  const provider = configuredProvider(requestedProvider);')
          replace('src/research.ts', '  if (provider === "duckduckgo") notes.push("Web-wide discovery used the built-in public DuckDuckGo search fallback. For higher-volume or more reproducible coverage, configure SearXNG, Brave Search, Serper, Tavily or Google CSE.");', '  if (provider === "duckduckgo") notes.push("Web-wide discovery used the built-in public DuckDuckGo index. Google Custom Search is the preferred hosted provider when GOOGLE_CSE_API_KEY and GOOGLE_CSE_CX are configured; users can choose an available provider in the web interface.");\n  if (provider === "google-cse") notes.push("Web-wide discovery used Google Custom Search as the external index selected for this investigation.");')

          # agent.ts: carry searchProvider into external research and cache key.
          replace('src/agent.ts', 'export type InvestigateOptions = { profile?: string; crawl?: Partial<CrawlPolicy>; force?: boolean; externalResearch?: boolean };', 'export type InvestigateOptions = { profile?: string; crawl?: Partial<CrawlPolicy>; force?: boolean; externalResearch?: boolean; searchProvider?: string };')
          replace('src/agent.ts', '  const cacheKey = `investigate:${rawUrl}:${profile}:${externalResearch ? "web" : "site"}:${JSON.stringify(options.crawl || {})}`;', '  const cacheKey = `investigate:${rawUrl}:${profile}:${externalResearch ? "web" : "site"}:${options.searchProvider || "default"}:${JSON.stringify(options.crawl || {})}`;')
          replace('src/agent.ts', '  const webResearch = externalResearch ? await researchExternalWeb(root.url, name.value, pages) : disabledWebResearch();', '  const webResearch = externalResearch ? await researchExternalWeb(root.url, name.value, pages, options.searchProvider) : disabledWebResearch();')
          replace('src/agent.ts', '  const result = await investigate(args.url, { profile: args.profile, force: Boolean(args.force), crawl: args.crawl, externalResearch });', '  const result = await investigate(args.url, { profile: args.profile, force: Boolean(args.force), crawl: args.crawl, externalResearch, searchProvider: args.searchProvider });')

          # server.ts: provider status endpoint and validation before quota reservation.
          replace('src/server.ts', 'import { exportFilename, generateHtml, generateJson, generateMarkdown, generatePdf, type ExportReport } from "./export-report.js";', 'import { exportFilename, generateHtml, generateJson, generateMarkdown, generatePdf, type ExportReport } from "./export-report.js";\nimport { searchProviderStatus } from "./research.js";')
          replace('src/server.ts', '''function validateUrl(value: unknown): string | undefined {
            if (typeof value !== "string" || !value.trim()) return undefined;
            try {
              const parsed = new URL(value.trim());
              if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return undefined;
              return parsed.toString();
            } catch {
              return undefined;
            }
          }''', '''function validateUrl(value: unknown): string | undefined {
            if (typeof value !== "string" || !value.trim()) return undefined;
            try {
              const parsed = new URL(value.trim());
              if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return undefined;
              return parsed.toString();
            } catch {
              return undefined;
            }
          }

          function validateSearchProvider(value: unknown): { ok: true; provider?: string } | { ok: false; message: string } {
            if (value === undefined || value === null || String(value).trim() === "") return { ok: true };
            const requested = String(value).trim().toLowerCase();
            const aliases: Record<string, string> = { google: "google-cse", "google_custom_search": "google-cse", ddg: "duckduckgo", searx: "searxng" };
            const id = aliases[requested] || requested;
            const status = searchProviderStatus();
            const provider = status.providers.find(p => p.id === id);
            if (!provider) return { ok: false, message: `Unsupported external search provider: ${requested}` };
            if (!provider.available) return { ok: false, message: `${provider.label} is not configured on this Hugging Face runtime. Choose an available provider or configure its Space secret(s).` };
            return { ok: true, provider: provider.id };
          }''')

          replace('src/server.ts', '''      if (u.pathname === "/actions") {
            json(res, 200, { actions: actionNames(), publicDemoActions: [...PUBLIC_DEMO_ACTIONS], remoteMcp: meta.mcp, attribution: attributionObject() });
            return;
          }

          const actionMatch''', '''      if (u.pathname === "/actions") {
            json(res, 200, { actions: actionNames(), publicDemoActions: [...PUBLIC_DEMO_ACTIONS], remoteMcp: meta.mcp, attribution: attributionObject() });
            return;
          }
          if (u.pathname === "/search-providers" && req.method === "GET") {
            json(res, 200, { ...searchProviderStatus(), note: "Google Custom Search is the preferred hosted index. The runtime falls back to DuckDuckGo when Google credentials are not configured." });
            return;
          }

          const actionMatch''')

          replace('src/server.ts', '''        args.url = url;
            const before = currentDemoStatus(req, user);''', '''        args.url = url;
            if (action === "investigate_url") {
              const selected = validateSearchProvider(args.searchProvider);
              if (!selected.ok) { json(res, 400, { error: selected.message, providers: searchProviderStatus(), attribution: attributionObject() }); return; }
              if (selected.provider) args.searchProvider = selected.provider;
            }
            const before = currentDemoStatus(req, user);''', 1)

          replace('src/server.ts', '''        args.url = url;
            const before = currentDemoStatus(req, user);
            if (!before.allowed) { rateLimited(res, before); return; }
            const demo = await reserveDemoRequest(req, user);
            const result = await runAction("investigate_url", args as any);''', '''        args.url = url;
            const selected = validateSearchProvider(args.searchProvider);
            if (!selected.ok) { json(res, 400, { error: selected.message, providers: searchProviderStatus(), attribution: attributionObject() }); return; }
            if (selected.provider) args.searchProvider = selected.provider;
            const before = currentDemoStatus(req, user);
            if (!before.allowed) { rateLimited(res, before); return; }
            const demo = await reserveDemoRequest(req, user);
            const result = await runAction("investigate_url", args as any);''', 1)
          replace('src/server.ts', '["/", "/health", "/me", "/actions", "/investigate", "/action/:name", "/mcp", "/.well-known/mcp.json", "/llms.txt"]', '["/", "/health", "/me", "/actions", "/search-providers", "/investigate", "/action/:name", "/mcp", "/.well-known/mcp.json", "/llms.txt"]')

          # Hugging Face Docker: Google CSE is preferred hosted provider; runtime falls back safely when secrets are absent.
          replace('hf-space/Dockerfile', '    URL_AGENT_ASSET_DIR=/app/assets \\\n    URL_AGENT_OWNER_USERNAME=vpicciuolo', '    URL_AGENT_ASSET_DIR=/app/assets \\\n    URL_AGENT_OWNER_USERNAME=vpicciuolo \\\n    URL_AGENT_SEARCH_PROVIDER=google-cse')

          # Hugging Face UI: add provider selector, status, dynamic availability, and include selection in full investigation request.
          replace('hf-space/index.html', '.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 285px auto;gap:10px}', '.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px 240px auto;gap:10px}.provider-help{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.5;margin-top:-2px}.provider-help strong{color:#d8efff}')
          replace('hf-space/index.html', '''          </select>
          <button id="runBtn" class="btn primary" disabled>Run analysis</button>
        </div>''', '''          </select>
          <select id="providerSelect" class="select" aria-label="External search index">
            <option value="google-cse">Google Custom Search · preferred</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="brave">Brave Search</option>
            <option value="serper">Serper · Google index</option>
            <option value="tavily">Tavily</option>
            <option value="searxng">SearXNG</option>
          </select>
          <button id="runBtn" class="btn primary" disabled>Run analysis</button>
          <div id="providerHelp" class="provider-help"><strong>External index:</strong> Google Custom Search is preferred for the hosted Space. Availability is detected from server-side configuration; unavailable providers are disabled automatically.</div>
        </div>''')

          replace('hf-space/index.html', 'This project supports SearXNG, Brave Search, Serper, Tavily and Google Custom Search through environment configuration; without one, external research is limited to third-party URLs discoverable from the target itself.', 'The hosted Space prefers Google Custom Search and lets signed-in users choose the external index for each Full Investigation. Available alternatives include DuckDuckGo, Brave Search, Serper, Tavily and SearXNG. Provider availability is detected server-side and recorded in the report.')
          replace('hf-space/index.html', '<details class="faq-item"><summary>What if no search provider is configured?</summary><p>The report says so clearly. External evidence is then limited to public third-party URLs discoverable from the target\'s own pages and structured data. For broader web discovery configure SearXNG, Brave Search, Serper, Tavily or Google CSE.</p></details>', '<details class="faq-item"><summary>Which external search index does the hosted demo use?</summary><p>Google Custom Search is the preferred hosted index. The selector beside the analysis type lists every supported provider and disables providers that are not configured. DuckDuckGo is available as the built-in fallback. The selected provider is recorded in the result and exported report.</p></details>')

          replace('hf-space/index.html', '''    function currentActionName(){const opt=$(\'actionSelect\').selectedOptions[0];return opt?.dataset?.action || ($(\'actionSelect\').value===\'/investigate\'?\'investigate_url\':$(\'actionSelect\').value.split(\'/\').pop());}
            function renderActionGuide(){const info=ACTION_GUIDE[currentActionName()] || ACTION_GUIDE.investigate_url;$(\'actionGuide\').innerHTML=`<div class="guide-top"><div><h3>${info.title}</h3><p>${info.desc}</p></div><span class="mode ${currentActionName()===\'investigate_url\'?\'web\':\'hosted\'}">${currentActionName()===\'investigate_url\'?\'Web-wide\':\'Hosted demo\'}</span></div><div class="guide-meta"><span>Input: ${info.input}</span><span>Returns: ${info.output}</span><span>${info.best}</span></div>`;}''', '''    function currentActionName(){const opt=$(\'actionSelect\').selectedOptions[0];return opt?.dataset?.action || ($(\'actionSelect\').value===\'/investigate\'?\'investigate_url\':$(\'actionSelect\').value.split(\'/\').pop());}
            function renderActionGuide(){const info=ACTION_GUIDE[currentActionName()] || ACTION_GUIDE.investigate_url;const usesIndex=currentActionName()===\'investigate_url\';$(\'providerSelect\').disabled=!usesIndex;$(\'providerSelect\').title=usesIndex?\'Choose the external web index for this investigation\':\'External index is used by Full investigation\';$(\'actionGuide\').innerHTML=`<div class="guide-top"><div><h3>${info.title}</h3><p>${info.desc}</p></div><span class="mode ${usesIndex?\'web\':\'hosted\'}">${usesIndex?\'Web-wide\':\'Hosted demo\'}</span></div><div class="guide-meta"><span>Input: ${info.input}</span><span>Returns: ${info.output}</span><span>${info.best}</span>${usesIndex?`<span>External index: ${$(\'providerSelect\').selectedOptions[0]?.textContent||\'auto\'}</span>`:\'\'}</div>`;}''')

          replace('hf-space/index.html', '''    async function refreshStatus(){try{const [healthRes,meRes]=await Promise.all([fetch('/health',{cache:'no-store'}),fetch('/me',{cache:'no-store'})]);const health=await healthRes.json();const me=await meRes.json();session=me;''', '''    function renderProviders(status){const select=$(\'providerSelect\');const previous=select.value;clear(select);(status.providers||[]).forEach(p=>{const opt=document.createElement(\'option\');opt.value=p.id;opt.disabled=!p.available;opt.textContent=p.label+(p.id===status.preferred?\' · preferred\':\'\')+(p.available?\'\':\' · not configured\');select.appendChild(opt)});const desired=(status.providers||[]).some(p=>p.id===previous&&p.available)?previous:status.default;select.value=desired||\'duckduckgo\';$(\'providerHelp\').innerHTML=`<strong>External index:</strong> ${select.selectedOptions[0]?.textContent||\'None\'}. Google Custom Search is the preferred hosted index; unavailable providers stay visible but disabled.`;renderActionGuide();}

            async function refreshStatus(){try{const [healthRes,meRes,providersRes]=await Promise.all([fetch('/health',{cache:'no-store'}),fetch('/me',{cache:'no-store'}),fetch('/search-providers',{cache:'no-store'})]);const health=await healthRes.json();const me=await meRes.json();const providers=await providersRes.json();session=me;renderProviders(providers);''')

          replace('hf-space/index.html', '''const res=await fetch($(\'actionSelect\').value,{method:\'POST\',headers:{\'content-type\':\'application/json\'},body:JSON.stringify({url:url.toString()})});''', '''const payload={url:url.toString()};if(currentActionName()===\'investigate_url\')payload.searchProvider=$(\'providerSelect\').value;const res=await fetch($(\'actionSelect\').value,{method:\'POST\',headers:{\'content-type\':\'application/json\'},body:JSON.stringify(payload)});''')
          replace('hf-space/index.html', "$('actionSelect').addEventListener('change',renderActionGuide);", "$('actionSelect').addEventListener('change',renderActionGuide);$('providerSelect').addEventListener('change',()=>{$('providerHelp').innerHTML='<strong>External index:</strong> '+$('providerSelect').selectedOptions[0].textContent+'. The selected provider will be recorded in the Full Investigation result and exports.';renderActionGuide();});")

          # Mobile layout keeps controls comfortable.
          replace('hf-space/index.html', '@media(max-width:760px){.wrap{padding:10px 12px 22px}.top{top:6px;margin-bottom:16px;padding:8px;border-radius:19px}.brand span{display:none}.brand img{width:48px;height:48px}.nav{justify-content:flex-start}.nav .btn{padding:9px 11px;font-size:12px}.hero{grid-template-columns:1fr;gap:16px}.hero-card{order:-1}.form-grid{grid-template-columns:1fr}.section{margin-top:50px}.section h2{font-size:30px}.lead{font-size:17px}.result-toolbar{align-items:flex-start}.pipeline{grid-template-columns:1fr}.mcp-grid{grid-template-columns:1fr}.web-evidence-metrics{grid-template-columns:repeat(2,1fr)}}', '@media(max-width:760px){.wrap{padding:10px 12px 22px}.top{top:6px;margin-bottom:16px;padding:8px;border-radius:19px}.brand span{display:none}.brand img{width:48px;height:48px}.nav{justify-content:flex-start}.nav .btn{padding:9px 11px;font-size:12px}.hero{grid-template-columns:1fr;gap:16px}.hero-card{order:-1}.form-grid{grid-template-columns:1fr}.provider-help{grid-column:1}.section{margin-top:50px}.section h2{font-size:30px}.lead{font-size:17px}.result-toolbar{align-items:flex-start}.pipeline{grid-template-columns:1fr}.mcp-grid{grid-template-columns:1fr}.web-evidence-metrics{grid-template-columns:repeat(2,1fr)}}')

          print('all patches applied')
          PY

      - name: Install and validate
        run: |
          npm install --ignore-scripts
          npm run typecheck
          npm test

      - name: Commit provider selector upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research.ts src/agent.ts src/server.ts hf-space/Dockerfile hf-space/index.html
          git commit -m "Add selectable external search indexes with Google preferred" || exit 0
          git push origin main

      - name: Deploy updated Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          rm -rf /tmp/hf-payload /tmp/hf-space
          mkdir -p /tmp/hf-payload/assets
          cp package.json tsconfig.json LICENSE SECURITY.md /tmp/hf-payload/
          cp -R src /tmp/hf-payload/src
          cp hf-space/README.md /tmp/hf-payload/README.md
          cp hf-space/Dockerfile /tmp/hf-payload/Dockerfile
          cp hf-space/index.html /tmp/hf-payload/index.html
          cp hf-space/patch-ui.mjs /tmp/hf-payload/patch-ui.mjs
          cp hf-space/ui-v2.css /tmp/hf-payload/ui-v2.css
          cp hf-space/ui-v2.js /tmp/hf-payload/ui-v2.js
          cp hf-space/assets/README.txt /tmp/hf-payload/assets/README.txt
          cp hf-space/assets/logo.base64.txt /tmp/hf-payload/assets/logo.base64.txt
          git clone https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent /tmp/hf-space
          rsync -av --delete --exclude='.git' /tmp/hf-payload/ /tmp/hf-space/
          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy selectable external search providers"
          git push "https://vpicciuolo:${HF_TOKEN}@huggingface.co/spaces/vpicciuolo/url-intelligence-agent" HEAD:main
