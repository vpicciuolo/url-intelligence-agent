name: Update README Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme-huggingface.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Hugging Face badge and live Space section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          badge = '  <a href="https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent"><img src="https://img.shields.io/badge/Hugging%20Face-Live%20Space%20%26%20Remote%20MCP-FFD21E?style=for-the-badge" alt="Try URL Intelligence Agent on Hugging Face"></a>\n'

          support_badge = '  <a href="https://hrn.ae/githubsupport"><img src="https://img.shields.io/badge/SUPPORT-Donate%20via%20Stripe-635BFF?style=for-the-badge&logo=stripe&logoColor=white" alt="Support via Stripe"></a>\n'

          if 'Hugging%20Face-Live%20Space%20%26%20Remote%20MCP' not in text:
              text = text.replace(support_badge, badge + support_badge, 1)

          section = '''\n---\n\n## 🤗 Try URL Intelligence Agent live on Hugging Face\n\nThe official **URL Intelligence Agent Hugging Face Space** runs the real open-source agent inside a live Docker environment, so you can test the project directly from your browser without installing anything locally.\n\n<p align="center">\n  <a href="https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent"><img src="https://img.shields.io/badge/OPEN%20LIVE%20SPACE-Try%20URL%20Intelligence%20Agent%20on%20Hugging%20Face-FFD21E?style=for-the-badge" alt="Open URL Intelligence Agent Hugging Face Space"></a>\n</p>\n\n### What you can do in the hosted Space\n\n- **Run a full URL investigation** from a normal web interface.\n- **Crawl the target website** and expand into public external evidence, articles, references and eligible social/profile URLs.\n- **Choose the external search/index provider** available in the hosted environment for wider-web discovery.\n- Run focused actions for **SEO, security, trust, social discovery, technology detection, brand intelligence, domain intelligence and structured data**.\n- Inspect **evidence, confidence, source provenance, timestamps and explicit contradictions** instead of receiving only a model-generated summary.\n- Open supporting public sources and see which evidence was actually fetched and verified.\n- Export completed investigations as a **human-readable branded PDF report**, plus **JSON, Markdown and HTML** for technical workflows.\n- Explore the complete action catalog and understand what is available in the hosted demo versus the full self-hosted runtime.\n- Test the project as a **Remote MCP server** from compatible AI clients and agent frameworks.\n\n### Hosted demo access\n\nThe public web demo requires a Hugging Face login and is intentionally rate-limited to **1 analysis request per account every 24 hours** to protect the public infrastructure from abuse. The project owner account is exempt. Developers who need unrestricted usage can clone this repository and run the full CLI, HTTP API, Docker service or local MCP server themselves.\n\n### Remote MCP\n\nCompatible AI clients can connect directly to the public Streamable HTTP MCP endpoint:\n\n```text\nhttps://vpicciuolo-url-intelligence-agent.hf.space/mcp\n```\n\nMachine-readable MCP discovery is also available at:\n\n```text\nhttps://vpicciuolo-url-intelligence-agent.hf.space/.well-known/mcp.json\n```\n\n**Live Space:** https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent\n\n**Live app:** https://vpicciuolo-url-intelligence-agent.hf.space/\n\n'''

          marker = '\n---\n\n## 🔥 Already running inside the HORNO ecosystem — now open source\n'
          if '## 🤗 Try URL Intelligence Agent live on Hugging Face' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker not found')
              text = text.replace(marker, section + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document live Hugging Face Space and Remote MCP"
          git push
