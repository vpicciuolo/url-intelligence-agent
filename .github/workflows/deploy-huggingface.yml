name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.github/workflows/deploy-huggingface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Verify Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare and validate Docker Space payload
        run: |
          set -euo pipefail
          rm -rf /tmp/hf-payload /tmp/logo-source /tmp/og-source /tmp/logo.jpg /tmp/og.jpg
          mkdir -p /tmp/hf-payload/assets
          cp package.json tsconfig.json LICENSE SECURITY.md /tmp/hf-payload/
          cp -R src /tmp/hf-payload/src
          cp hf-space/README.md /tmp/hf-payload/README.md
          cp hf-space/Dockerfile /tmp/hf-payload/Dockerfile
          cp hf-space/index.html /tmp/hf-payload/index.html
          cp hf-space/patch-ui.mjs /tmp/hf-payload/patch-ui.mjs
          cp hf-space/ui-v2.css /tmp/hf-payload/ui-v2.css
          cp hf-space/ui-v2.js /tmp/hf-payload/ui-v2.js
          cp hf-space/assets/README.txt /tmp/hf-payload/assets/README.txt

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          ACCEPT='image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'

          curl --fail --location --retry 3 --retry-delay 2 -A "$UA" -H "Accept: $ACCEPT" \
            'https://storage.mlcdn.com/account_image/2365654/uunRmrxG6vCBRo8B4kvrAd40Ut0z0qOAHV2DYpHf.jpg' \
            -o /tmp/logo-source

          curl --fail --location --retry 3 --retry-delay 2 -A "$UA" -H "Accept: $ACCEPT" \
            'https://storage.mlcdn.com/account_image/2365654/ceTJNoztKxv1AW3dpdSaf5XSHWNMbhlKAzyFdUJN.jpg' \
            -o /tmp/og-source

          echo 'Downloaded source formats:'
          file /tmp/logo-source /tmp/og-source

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64

          logo = Image.open('/tmp/logo-source').convert('RGB')
          logo.save('/tmp/logo.jpg', 'JPEG', quality=94, optimize=True, progressive=True)

          og = Image.open('/tmp/og-source').convert('RGB').resize((1200, 630), Image.Resampling.LANCZOS)
          og.save('/tmp/og.jpg', 'JPEG', quality=93, optimize=True, progressive=True)

          logo_bytes = Path('/tmp/logo.jpg').read_bytes()
          og_bytes = Path('/tmp/og.jpg').read_bytes()
          if logo_bytes[:2] != b'\xff\xd8' or len(logo_bytes) < 5000:
              raise SystemExit('Normalized logo is invalid')
          if og_bytes[:2] != b'\xff\xd8' or len(og_bytes) < 15000:
              raise SystemExit('Normalized OG image is invalid')

          Path('/tmp/hf-payload/assets/logo.base64.txt').write_text(base64.b64encode(logo_bytes).decode('ascii'), encoding='ascii')
          encoded = base64.b64encode(og_bytes).decode('ascii')
          chunk = 60000
          for i in range(0, len(encoded), chunk):
              n = i // chunk + 1
              Path(f'/tmp/hf-payload/assets/og.{n:02d}.b64').write_text(encoded[i:i+chunk], encoding='ascii')

          print('logo source:', logo.size, len(logo_bytes), 'bytes')
          print('og source:', og.size, len(og_bytes), 'bytes')
          print('og chunks:', (len(encoded) + chunk - 1) // chunk)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          if package.get('version') != '1.2.0':
              raise SystemExit(f"Unexpected package version: {package.get('version')}")

          readme = Path('/tmp/hf-payload/README.md').read_text(encoding='utf-8')
          match = re.match(r'^---\n(.*?)\n---\n', readme, re.S)
          if not match:
              raise SystemExit('Hugging Face README frontmatter is missing')
          front = match.group(1)
          def value(name):
              m = re.search(rf'^{re.escape(name)}:\s*(.*?)\s*$', front, re.M)
              if not m:
                  raise SystemExit(f'Missing Hugging Face metadata: {name}')
              return m.group(1).strip()
          if len(value('short_description')) > 60:
              raise SystemExit('Hugging Face short_description exceeds 60 characters')
          expected_thumbnail = 'https://vpicciuolo-url-intelligence-agent.hf.space/assets/og.jpg?v=20260908-2'
          if value('thumbnail') != expected_thumbnail:
              raise SystemExit('Unexpected thumbnail URL')
          if 'v1.2.0' not in readme or 'Claim Provenance' not in readme:
              raise SystemExit('Hugging Face README is not synchronized with v1.2 provenance release')
          if 'Evidence Inspector' not in Path('/tmp/hf-payload/ui-v2.js').read_text(encoding='utf-8'):
              raise SystemExit('Evidence Inspector UI code missing')
          print('Hugging Face v1.2 payload metadata OK')
          PY

      - name: Sync Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/hf-space
          git clone https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent /tmp/hf-space
          rsync -av --delete --exclude='.git' /tmp/hf-payload/ /tmp/hf-space/
          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Hugging Face Space changes to deploy."
          else
            git commit -m "Deploy URL Intelligence Agent v1.2.0 from GitHub ${GITHUB_SHA}"
            git push "https://vpicciuolo:${HF_TOKEN}@huggingface.co/spaces/vpicciuolo/url-intelligence-agent" HEAD:main
          fi

      - name: Verify Hugging Face runtime, provenance, MCP and brand assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          api_url = 'https://huggingface.co/api/spaces/vpicciuolo/url-intelligence-agent'
          app_base = 'https://vpicciuolo-url-intelligence-agent.hf.space'
          failures = {'BUILD_ERROR', 'RUNTIME_ERROR', 'CONFIG_ERROR'}

          def request(url, auth=False):
              headers = {'User-Agent': 'url-intelligence-agent-deploy-check/1.2'}
              if auth:
                  headers['Authorization'] = f"Bearer {os.environ['HF_TOKEN']}"
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30)

          for attempt in range(1, 81):
              with request(api_url, auth=True) as response:
                  info = json.load(response)
                  runtime = info.get('runtime') or {}
                  stage = runtime.get('stage') or 'UNKNOWN'
              print(f'Hugging Face runtime stage: {stage} (attempt {attempt}/80)')
              if stage == 'RUNNING':
                  break
              if stage in failures:
                  raise SystemExit(f'Hugging Face Space failed with stage {stage}')
              time.sleep(5)
          else:
              raise SystemExit('Hugging Face Space did not reach RUNNING')

          time.sleep(5)

          # Core runtime release verification.
          with request(app_base + '/health') as response:
              health = json.load(response)
          attribution = health.get('attribution') or {}
          if not health.get('ok'):
              raise SystemExit(f'Live /health is not OK: {health}')
          if attribution.get('version') != '1.2.0':
              raise SystemExit(f"Live version mismatch: {attribution.get('version')}")
          if int(health.get('actions') or 0) < 36:
              raise SystemExit(f"Live action count too low: {health.get('actions')}")
          print('Live /health OK: v1.2.0')

          # Action registry verification.
          with request(app_base + '/actions') as response:
              actions_payload = json.load(response)
          actions = set(actions_payload.get('actions') or [])
          required_actions = {'investigate_url', 'inspect_provenance', 'verify_claim', 'structured_data'}
          missing = sorted(required_actions - actions)
          if missing:
              raise SystemExit(f'Live /actions missing: {missing}')
          print('Live /actions includes provenance tools.')

          # MCP discovery verification.
          with request(app_base + '/.well-known/mcp.json') as response:
              mcp = json.load(response)
          protocols = set(mcp.get('protocolVersions') or [])
          if '2026-07-28' not in protocols:
              raise SystemExit(f'MCP 2026-07-28 missing from live discovery: {sorted(protocols)}')
          public_tools = set(mcp.get('publicDemoTools') or [])
          if not {'inspect_provenance', 'verify_claim'}.issubset(public_tools):
              raise SystemExit('Provenance tools missing from live public MCP discovery')
          print('Live MCP discovery OK: 2026-07-28 + provenance tools.')

          # Assets.
          for path, minimum in [('/assets/logo.jpg?v=20260908-2', 5000), ('/assets/og.jpg?v=20260908-2', 15000)]:
              with request(app_base + path) as response:
                  data = response.read()
                  if response.status != 200 or response.headers.get_content_type() != 'image/jpeg' or len(data) < minimum or data[:2] != b'\xff\xd8':
                      raise SystemExit(f'Invalid live asset {path}')
                  print(f'{path} OK ({len(data)} bytes)')

          # Hosted UI has approved images and the embedded v1.2 enhancement code.
          with request(app_base + '/') as response:
              page = response.read()
          if page.count(b'data:image/jpeg;base64,') < 2:
              raise SystemExit('Visible UI does not contain both embedded approved images')
          for marker in [b'Evidence Inspector', b'Claim Provenance', b'inspect_provenance', b'verify_claim']:
              if marker not in page:
                  raise SystemExit(f'Live UI missing v1.2 marker: {marker!r}')
          print('Visible UI contains v1.2 Evidence Inspector and approved branding.')
          PY
