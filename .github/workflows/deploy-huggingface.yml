name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.github/workflows/deploy-huggingface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Verify Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare Docker Space payload
        run: |
          rm -rf /tmp/hf-payload
          mkdir -p /tmp/hf-payload
          cp package.json tsconfig.json LICENSE SECURITY.md /tmp/hf-payload/
          cp -R src /tmp/hf-payload/src
          cp hf-space/README.md /tmp/hf-payload/README.md
          cp hf-space/Dockerfile /tmp/hf-payload/Dockerfile
          cp hf-space/index.html /tmp/hf-payload/index.html
          cp hf-space/patch-ui.mjs /tmp/hf-payload/patch-ui.mjs
          cp hf-space/ui-v2.css /tmp/hf-payload/ui-v2.css
          cp hf-space/ui-v2.js /tmp/hf-payload/ui-v2.js

          # Hugging Face rejects normal git pushes containing binary files.
          # Keep only text-safe asset sources in the Space repository.
          mkdir -p /tmp/hf-payload/assets
          cp hf-space/assets/README.txt /tmp/hf-payload/assets/README.txt
          cp hf-space/assets/logo.base64.txt /tmp/hf-payload/assets/logo.base64.txt

      - name: Sync Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent /tmp/hf-space
          rsync -av --delete --exclude='.git' /tmp/hf-payload/ /tmp/hf-space/
          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Hugging Face Space changes to deploy."
            exit 0
          fi
          git commit -m "Deploy Docker Space from GitHub ${GITHUB_SHA}"
          git push "https://vpicciuolo:${HF_TOKEN}@huggingface.co/spaces/vpicciuolo/url-intelligence-agent" HEAD:main
