name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.github/workflows/deploy-huggingface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Verify Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare Docker Space payload
        run: |
          rm -rf /tmp/hf-payload
          mkdir -p /tmp/hf-payload
          cp package.json tsconfig.json LICENSE SECURITY.md /tmp/hf-payload/
          cp -R src /tmp/hf-payload/src
          cp hf-space/README.md /tmp/hf-payload/README.md
          cp hf-space/Dockerfile /tmp/hf-payload/Dockerfile
          cp hf-space/index.html /tmp/hf-payload/index.html

          mkdir -p /tmp/hf-payload/assets
          if [ -d hf-space/assets ]; then
            cp -R hf-space/assets/. /tmp/hf-payload/assets/
          fi

          # Build the real square project logo from the repository-safe base64 source.
          if [ -s hf-space/assets/logo.base64.txt ]; then
            base64 --decode hf-space/assets/logo.base64.txt > /tmp/hf-payload/assets/logo.jpg
          fi

          # Use the official URL Intelligence Agent banner as the 1200x630 social/OG asset.
          curl --fail --location --silent --show-error \
            'https://storage.mlcdn.com/account_image/2365654/725Q0AzeY15nwDK3JocgKXq5AhxRoNC53LUBchc7.png' \
            --output /tmp/hf-payload/assets/og.jpg

          file /tmp/hf-payload/assets/logo.jpg /tmp/hf-payload/assets/og.jpg

      - name: Sync Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent /tmp/hf-space
          rsync -av --delete --exclude='.git' /tmp/hf-payload/ /tmp/hf-space/
          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Hugging Face Space changes to deploy."
            exit 0
          fi
          git commit -m "Deploy Docker Space from GitHub ${GITHUB_SHA}"
          git push "https://vpicciuolo:${HF_TOKEN}@huggingface.co/spaces/vpicciuolo/url-intelligence-agent" HEAD:main
