name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.github/workflows/deploy-huggingface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Verify Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare and validate Docker Space payload
        run: |
          set -euo pipefail
          rm -rf /tmp/hf-payload
          mkdir -p /tmp/hf-payload
          cp package.json tsconfig.json LICENSE SECURITY.md /tmp/hf-payload/
          cp -R src /tmp/hf-payload/src
          cp hf-space/README.md /tmp/hf-payload/README.md
          cp hf-space/Dockerfile /tmp/hf-payload/Dockerfile
          cp hf-space/index.html /tmp/hf-payload/index.html
          cp hf-space/patch-ui.mjs /tmp/hf-payload/patch-ui.mjs
          cp hf-space/ui-v2.css /tmp/hf-payload/ui-v2.css
          cp hf-space/ui-v2.js /tmp/hf-payload/ui-v2.js

          # Validate the Hugging Face Space card metadata before pushing it.
          # In particular, short_description has a strict 60-character limit.
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/hf-payload/README.md').read_text(encoding='utf-8')
          match = re.match(r'^---\n(.*?)\n---\n', text, re.S)
          if not match:
              raise SystemExit('Hugging Face README frontmatter is missing')
          front = match.group(1)

          def value(name):
              m = re.search(rf'^{re.escape(name)}:\s*(.*?)\s*$', front, re.M)
              if not m:
                  raise SystemExit(f'Missing Hugging Face metadata: {name}')
              return m.group(1).strip()

          expected = {
              'title': 'URL Intelligence Agent',
              'sdk': 'docker',
              'app_port': '7860',
              'license': 'mit',
              'hf_oauth': 'true',
          }
          for key, wanted in expected.items():
              actual = value(key)
              if actual != wanted:
                  raise SystemExit(f'Invalid {key}: {actual!r}; expected {wanted!r}')

          short = value('short_description')
          if len(short) > 60:
              raise SystemExit(f'Hugging Face short_description is too long: {len(short)} chars')
          if short != 'Evidence-first URL intelligence, reports and Remote MCP.':
              raise SystemExit(f'Unexpected short_description: {short!r}')

          thumbnail = value('thumbnail')
          expected_thumbnail = 'https://vpicciuolo-url-intelligence-agent.hf.space/assets/og.jpg?v=20260908-1'
          if thumbnail != expected_thumbnail:
              raise SystemExit(f'Unexpected thumbnail URL: {thumbnail!r}')

          required_tags = {
              'mcp', 'remote-mcp', 'url-intelligence', 'web-intelligence',
              'web-research', 'source-provenance', 'seo', 'security',
              'ai-agent', 'web-crawler', 'due-diligence', 'open-graph',
              'social-discovery', 'competitive-intelligence', 'website-monitoring'
          }
          tags = set(re.findall(r'^\s{2}-\s+([^\s]+)\s*$', front, re.M))
          missing = sorted(required_tags - tags)
          if missing:
              raise SystemExit(f'Missing required Hugging Face tags: {missing}')

          print(f'Hugging Face card metadata valid: short_description={len(short)} chars, tags={len(tags)}')
          PY

          # Keep the Space git repository text-safe. The Docker build decodes
          # these embedded base64 sources into /assets/logo.jpg and /assets/og.jpg.
          mkdir -p /tmp/hf-payload/assets
          cp hf-space/assets/README.txt /tmp/hf-payload/assets/README.txt
          cp hf-space/assets/logo.base64.txt /tmp/hf-payload/assets/logo.base64.txt
          shopt -s nullglob
          for asset in hf-space/assets/og.*.b64; do
            cp "$asset" /tmp/hf-payload/assets/
          done
          if ! compgen -G '/tmp/hf-payload/assets/og.*.b64' > /dev/null; then
            echo "Open Graph base64 chunks are missing."
            exit 1
          fi

      - name: Sync Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/hf-space
          git clone https://huggingface.co/spaces/vpicciuolo/url-intelligence-agent /tmp/hf-space
          rsync -av --delete --exclude='.git' /tmp/hf-payload/ /tmp/hf-space/
          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Hugging Face Space changes to deploy."
            exit 0
          fi
          git commit -m "Deploy Docker Space from GitHub ${GITHUB_SHA}"
          git push "https://vpicciuolo:${HF_TOKEN}@huggingface.co/spaces/vpicciuolo/url-intelligence-agent" HEAD:main

      - name: Verify Hugging Face runtime and brand assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          api_url = 'https://huggingface.co/api/spaces/vpicciuolo/url-intelligence-agent'
          app_base = 'https://vpicciuolo-url-intelligence-agent.hf.space'
          terminal_failures = {'BUILD_ERROR', 'RUNTIME_ERROR', 'CONFIG_ERROR'}
          last_stage = None

          def request(url, auth=False):
              headers = {'User-Agent': 'url-intelligence-agent-deploy-check/1.1'}
              if auth:
                  headers['Authorization'] = f"Bearer {os.environ['HF_TOKEN']}"
              req = urllib.request.Request(url, headers=headers)
              return urllib.request.urlopen(req, timeout=30)

          for attempt in range(1, 61):
              with request(api_url, auth=True) as response:
                  payload = json.load(response)
              runtime = payload.get('runtime') or {}
              stage = runtime.get('stage') or 'UNKNOWN'
              if stage != last_stage:
                  print(f'Hugging Face runtime stage: {stage} (attempt {attempt}/60)')
                  last_stage = stage
              if stage == 'RUNNING':
                  break
              if stage in terminal_failures:
                  print(json.dumps(runtime, indent=2, sort_keys=True))
                  raise SystemExit(f'Hugging Face Space failed with stage {stage}')
              time.sleep(5)
          else:
              raise SystemExit(f'Hugging Face Space did not reach RUNNING; last stage={last_stage}')

          # Give the public proxy a moment to converge after a rebuild.
          time.sleep(3)

          with request(f'{app_base}/health') as response:
              health = response.read()
              if response.status != 200 or not health:
                  raise SystemExit('Live /health check failed')
              print(f'/health OK ({len(health)} bytes)')

          with request(f'{app_base}/assets/logo.jpg?v=20260908-1') as response:
              logo = response.read()
              ctype = response.headers.get_content_type()
              if response.status != 200 or ctype != 'image/jpeg' or len(logo) < 5000 or logo[:2] != b'\xff\xd8':
                  raise SystemExit(f'Live logo asset invalid: status={response.status}, type={ctype}, bytes={len(logo)}')
              print(f'logo.jpg OK ({len(logo)} bytes)')

          with request(f'{app_base}/assets/og.jpg?v=20260908-1') as response:
              og = response.read()
              ctype = response.headers.get_content_type()
              if response.status != 200 or ctype != 'image/jpeg' or len(og) < 15000 or og[:2] != b'\xff\xd8':
                  raise SystemExit(f'Live Open Graph asset invalid: status={response.status}, type={ctype}, bytes={len(og)}')
              print(f'og.jpg OK ({len(og)} bytes)')

          with request(f'{app_base}/') as response:
              page = response.read()
              if response.status != 200:
                  raise SystemExit(f'Live app root returned {response.status}')
              # Visible logo and hero image are embedded by patch-ui.mjs so they
              # remain reliable inside Hugging Face proxy/base-path rendering.
              embedded_count = page.count(b'data:image/jpeg;base64,')
              if embedded_count < 2:
                  raise SystemExit(f'Expected embedded visible brand images; found {embedded_count}')
              print(f'Live app UI OK; embedded brand images={embedded_count}')

          print('Hugging Face Space is RUNNING and social/visible brand assets are valid.')
          PY
