name: One-shot Hugging Face ecosystem update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ecosystem-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hugging Face ecosystem update
        run: python3 scripts/patch_hf_ecosystem.py
      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Strengthen HORNO Network ecosystem links on Hugging Face"
          git push origin HEAD:main
