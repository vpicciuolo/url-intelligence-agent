name: One-time README Versioning Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-versioning-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize README release hierarchy
        run: python3 scripts/readme-versioning-cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes needed."
            exit 0
          fi
          git commit -m "Clean README release version hierarchy"
          git push origin HEAD:main
