name: Apply External Verification and Ecosystem Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-verification-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Normalize current provider note
        run: python3 external_verification_prepatch.py

      - name: Apply runtime, UI, SEO and documentation upgrade
        run: python3 external_verification_upgrade.py

      - name: Install and validate
        run: |
          npm install
          npm run typecheck
          npm test

      - name: Commit upgraded implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/research.ts src/agent.ts src/export-report.ts hf-space/index.html hf-space/README.md hf-space/Dockerfile docs/WEB_RESEARCH.md .env.example
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Verify external references before increasing corroboration"
          git push origin HEAD:main
