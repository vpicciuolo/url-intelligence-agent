name: Finalize URL Intelligence Agent v1.4.0 metadata

on:
  push:
    branches:
      - release/v1.4.0
    paths:
      - .github/workflows/apply-v1.4-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize_metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.4.0
          fetch-depth: 0

      - name: Synchronize Hugging Face README with v1.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hf-space/README.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'v1.3.0 introduces the **Claim Provenance & Temporal Consistency Engine**. The agent preserves where values came from, normalizes field values, compares metadata/structured/visible representations, separates compatible variation from real contradiction, detects drift and explains why a preferred value was selected.':
            'v1.4.0 builds on the **Claim Provenance & Temporal Consistency Engine** with semantic cross-field reconciliation, stronger stale-metadata detection, bound-aware claim comparison and typed source-verification contracts. Original observations remain traceable even when the resolver selects a preferred value.',
            'https://img.shields.io/badge/release-v1.3.0-00c853?style=for-the-badge':
            'https://img.shields.io/badge/release-v1.4.0-00c853?style=for-the-badge',
            'alt="v1.3.0"': 'alt="v1.4.0"',
            '## Semantic conflict intelligence\n\nThe v1.3 resolver distinguishes semantic equivalence and wording variation from factual disagreement and explicit logical contradiction, reducing false-positive conflicts in metadata while preserving provenance and source-level evidence.':
            '## Semantic reconciliation and source verification\n\nThe v1.4 resolver connects semantically equivalent metrics across evidence layers while preserving scope, source and time. It distinguishes logical contradiction from compatible wording, numerical bounds, precision differences and temporal drift, and it keeps unresolved competing evidence explicit for downstream agents.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected release text missing: {old[:80]}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate release-facing metadata
        run: |
          grep -q '# 🧠 URL Intelligence Agent v1.4.0' hf-space/README.md
          grep -q 'release-v1.4.0' hf-space/README.md
          grep -q 'Semantic reconciliation and source verification' hf-space/README.md
          grep -q 'semantic cross-field reconciliation' hf-space/README.md
          ! grep -q 'release-v1.3.0' hf-space/README.md
          git diff --check

      - name: Commit metadata synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-space/README.md
          if git diff --cached --quiet; then
            echo "Hugging Face README already synchronized."
          else
            git commit -m "docs: synchronize Hugging Face release metadata for v1.4.0"
            git push origin HEAD:release/v1.4.0
          fi
