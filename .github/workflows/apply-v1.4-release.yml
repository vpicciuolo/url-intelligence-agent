# Staged release execution
name: Build URL Intelligence Agent v1.4.0

on:
  push:
    branches:
      - release/v1.4.0
    paths:
      - scripts/apply-v1.4-release.mjs
      - scripts/fix-v1.4-mcp.mjs
      - scripts/fix-v1.4-bound-anchors.mjs
      - scripts/fix-v1.4-text-numeric-compat.mjs
      - .github/workflows/apply-v1.4-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v1.4.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize provenance documentation heading for release patch
        run: node -e 'const fs=require("fs");const p="docs/PROVENANCE.md";let s=fs.readFileSync(p,"utf8");const a="# Claim Provenance & Temporal Consistency Engine";const b="# Claim provenance and temporal consistency";if(!s.includes(a))throw new Error("provenance heading missing");fs.writeFileSync(p,s.replace(a,b));'

      - name: Apply v1.4 implementation
        run: node scripts/apply-v1.4-release.mjs

      - name: Preserve original metric predicates in observation ledger
        run: node -e 'const fs=require("fs");const p="src/provenance.ts";let s=fs.readFileSync(p,"utf8");const a="return canonicalMetricPredicate(`metric:${slug}`);";const b="return `metric:${slug}`;";if(!s.includes(a))throw new Error("metric predicate patch target missing");fs.writeFileSync(p,s.replace(a,b));'

      - name: Preserve lower-bound qualifiers in free-text anchors
        run: node scripts/fix-v1.4-bound-anchors.mjs

      - name: Compare numeric ranges embedded in free text
        run: node scripts/fix-v1.4-text-numeric-compat.mjs

      - name: Normalize typed MCP output schemas
        run: node scripts/fix-v1.4-mcp.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Provenance fixtures
        run: npm run test:provenance-fixtures

      - name: Normalize generated Markdown whitespace
        run: sed -i 's/[[:space:]]\+$//' VERSIONING.md

      - name: Validate release
        run: |
          git diff --check
          test "$(cat VERSION)" = "1.4.0"
          test "$(cat hf-space/VERSION)" = "1.4.0"
          node -e "const p=require('./package.json');if(p.version!=='1.4.0')process.exit(1)"
          grep -q 'version: "1.4.0"' src/credits.ts
          grep -q semantic_cross_field_reconciliation src/provenance.ts
          grep -q totalMatchedClaims src/provenance.ts
          grep -q embeddedNumericStatementsCompatible src/provenance.ts
          grep -q normalizedEvidenceSchema src/mcp.ts

      - name: Keep workflow changes out of the Actions-authenticated push
        run: |
          git checkout HEAD -- .github/workflows/deploy-huggingface.yml
          git checkout HEAD -- .github/workflows/apply-v1.4-release.yml

      - name: Remove one-shot release scripts
        run: |
          rm -f scripts/apply-v1.4-release.mjs
          rm -f scripts/fix-v1.4-mcp.mjs
          rm -f scripts/fix-v1.4-bound-anchors.mjs
          rm -f scripts/fix-v1.4-text-numeric-compat.mjs
          rm -f package-lock.json

      - name: Commit tested release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release v1.4.0 semantic reconciliation and source verification"
          git push origin HEAD:release/v1.4.0
